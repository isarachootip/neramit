[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_OPTIONS = "--dns-result-order=ipv4first --max-old-space-size=2048"
NEXT_TELEMETRY_DISABLED = "1"

[phases.install]
cmds = ["npm install --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx next start -H 0.0.0.0 -p ${PORT:-3000}"
